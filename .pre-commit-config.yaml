# Project JARVIS Pre-Commit Hook Configuration
# Prevents accidental credential leaks and enforces 10-Layer Security Suite standards.
repos:
  - repo: local
    hooks:
      - id: jarvis-git-shield
        name: JARVIS 10-Layer Git Shield (Secret & Credential Leak Prevention)
        entry: python scripts/git_pre_commit_hook.py
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
