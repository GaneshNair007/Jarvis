# Auto-labeling configuration for actions/labeler v5
'🐛 bug':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*test*.py'
          - 'tests/**/*'

'📚 documentation':
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - '**/*.md'
          - 'README*'

'🚀 feature':
  - changed-files:
      - any-glob-to-any-file:
          - 'jarvis/agents/**/*'
          - 'jarvis/plugins/**/*'

'🔧 configuration':
  - changed-files:
      - any-glob-to-any-file:
          - '*.yml'
          - '*.yaml'
          - '*.toml'
          - '*.json'
          - '.github/**/*'

'🐳 docker':
  - changed-files:
      - any-glob-to-any-file:
          - 'Dockerfile*'
          - 'docker-compose*.yml'

'🔒 security':
  - changed-files:
      - any-glob-to-any-file:
          - '**/security*.py'
          - '.github/workflows/security.yml'

'⚡ performance':
  - changed-files:
      - any-glob-to-any-file:
          - '**/performance*.py'
          - '.github/workflows/performance.yml'

'🧪 testing':
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**/*'
          - '**/test_*.py'

'dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'requirements*.txt'
          - 'pyproject.toml'
          - 'setup.py'
