name: Bug Report
description: Report an issue, bug, or unexpected behavior in JARVIS
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a bug report! Please provide detailed information to help reproduce and resolve the issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start server with `uvicorn jarvis.api.server:app`
        2. Execute POST /api/v1/...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Traceback
      description: Paste relevant terminal output or log snippets.
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Linux (Ubuntu/Debian)
        - Windows 11
        - macOS
        - Docker
    validations:
      required: true

