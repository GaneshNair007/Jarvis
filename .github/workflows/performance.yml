name: ⚡ Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: 🏃 Run Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-benchmark memory-profiler
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-ci.txt

      - name: ⚡ Run benchmarks
        run: |
          test -f tests/test_benchmarks.py
          python -m pytest tests/test_benchmarks.py --benchmark-only --benchmark-json=benchmark.json
          test -s benchmark.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json
          if-no-files-found: error
          retention-days: 14

  publish-benchmarks:
    name: 📊 Publish benchmark history
    needs: benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main for GitHub Pages publication
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: .

      # The existing gh-pages branch is the persistent benchmark history store.
      # Keep the write token out of the job that executes pull-request code.
      - name: 📈 Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "pytest"
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          fail-on-alert: false
