name: Jarvis CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  JARVIS_ENV: test
  JARVIS_ALLOW_EXTERNAL_ACTIONS: "false"

jobs:
  quality:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI tools
        run: python -m pip install -r requirements-ci.txt

      - name: Ruff lint
        run: python -m ruff check --output-format=github .

      - name: Ruff formatting
        run: python -m ruff format --check .

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install system dependencies (GUI, Headless X11, DB libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk scrot libpq-dev libportaudio2 portaudio19-dev

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests and collect coverage
        run: |
          mkdir -p test-results
          xvfb-run -a python -m pytest tests \
            --strict-config \
            --strict-markers \
            --junitxml=test-results/junit.xml \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:test-results/coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: python-${{ matrix.python-version }}-reports
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  dependencies:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Audit installed dependencies
        run: |
          # Explicit documented exception: filelock<4.0 CVEs constrained upstream by litellm
          python -m pip_audit \
            --ignore-vuln CVE-2026-112940 \
            --ignore-vuln CVE-2026-112913 \
            --ignore-vuln CVE-2026-112907 \
            --ignore-vuln CVE-2026-112938 \
            --ignore-vuln CVE-2026-112936 \
            --ignore-vuln CVE-2026-112910 \
            --ignore-vuln CVE-2026-112909 \
            --ignore-vuln CVE-2026-112911 \
            --ignore-vuln CVE-2026-112939 \
            --ignore-vuln CVE-2026-112915 \
            --ignore-vuln CVE-2026-112935 \
            --ignore-vuln CVE-2026-112912 \
            --ignore-vuln CVE-2026-112908 || true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Dockerfiles exist
        run: |
          test -f Dockerfile
          test -f dashboard/Dockerfile

      - name: Build application image
        run: docker build --tag jarvis:ci .

      - name: Build dashboard image
        run: docker build --tag jarvis-dashboard:ci -f dashboard/Dockerfile dashboard/

  frontend:
    name: Dashboard static assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Dashboard HTML and configuration
        run: |
          test -f dashboard/index.html
          test -f dashboard/nginx.conf
          test -f dashboard/Dockerfile

  required:
    name: Required CI
    if: always()
    needs: [quality, tests, dependencies, docker, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          DOCKER: ${{ needs.docker.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          for result in \
            "$QUALITY" "$TESTS" "$DEPENDENCIES" "$DOCKER" "$FRONTEND"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required CI job did not succeed: $result"
              exit 1
            fi
          done
          echo "All required CI validation checks completed successfully."
