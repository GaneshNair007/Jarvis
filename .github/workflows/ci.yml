name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Python Bytecode Compilation Verification (with Auto-Retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: |
            python -m py_compile $(find jarvis search core alembic tests -name "*.py")

      - name: Flake8 Critical Linting (with Auto-Retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: |
            # Stop build on syntax errors or undefined names
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: Automated Test Suite (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      JARVIS_ENV: test
      JARVIS_SECRET_KEY: test_secret_key_32_bytes_long_ok
      MEILISEARCH_MASTER_KEY: masterKey123
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (Headless Display & Database Drivers)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-xserver-utils libpq-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies (with Auto-Retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: |
            python -m pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt
            python -m playwright install --with-deps chromium

      - name: Run Pytest Acceptance & Unit Suites (with Auto-Retry on Failure)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error
          command: |
            xvfb-run -a pytest -v
