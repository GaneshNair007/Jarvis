name: 📊 Code Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  coverage:
    name: 📈 Generate Coverage Report
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jarvis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install pytest pytest-cov coverage[toml]
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jarvis_test
        run: |
          pytest tests/ \
            --cov=jarvis \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-jarvis
          fail_ci_if_error: false

      - name: 📈 Coverage Badge
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

      - name: 📊 Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  mutation-testing:
    name: 🧬 Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 📦 Install mutmut
        run: |
          pip install mutmut
          pip install -r requirements.txt

      - name: 🧬 Run mutation tests
        run: |
          mutmut run --paths-to-mutate=jarvis/ || echo "Mutation testing baseline established"
          mutmut results || true
