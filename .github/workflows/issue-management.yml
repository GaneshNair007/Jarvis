name: Issue Management & Auto-Triage

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-triage:
    name: Auto-Label and Greet
    runs-on: ubuntu-latest
    steps:
      - name: Greet Contributor
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const creator = issue.user.login;
            console.log(`Processing issue #${issue.number} opened by ${creator}`);
