name: 🏷️ Issue & PR Management

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, labeled, synchronize]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  auto-label:
    name: 🏷️ Auto Label
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  greet-new-contributors:
    name: 👋 Greet Contributors
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            🎉 Thanks for opening your first issue! We'll review it soon.
            
            📚 Check out our [Contributing Guide](CONTRIBUTING.md) for more info.
            
            🏆 Achievement Progress: Pair Extraordinaire badge!
          pr-message: |
            🚀 Awesome! Thanks for your first pull request!
            
            A maintainer will review it soon. In the meantime:
            - ✅ Ensure all tests pass
            - 📝 Update documentation if needed
            - 🎯 Keep commits focused and atomic
            
            🏆 Contributing towards GitHub badges!

  stale-issues:
    name: 🗑️ Mark Stale Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had 
            recent activity. It will be closed if no further activity occurs. Thank you!
          stale-pr-message: |
            This PR has been automatically marked as stale. Please update or it will be closed.
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'

  auto-assign:
    name: 👤 Auto Assign
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - uses: kentaro-m/auto-assign-action@v1.2.6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
