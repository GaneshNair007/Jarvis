name: 🌍 Multi-Platform Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'  # Daily at 4 AM UTC
  workflow_dispatch:

jobs:
  test-matrix:
    name: 🧪 Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist
          pip install -r requirements.txt

      - name: 🧪 Run tests
        run: pytest tests/ -n auto --maxfail=3 -v

      - name: ✅ Platform compatibility verified
        run: echo "✅ Tests passed on ${{ matrix.os }} with Python ${{ matrix.python-version }}"

  docker-test:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🏗️ Build Docker image
        run: docker build -t jarvis:test .

      - name: 🧪 Test Docker container
        run: |
          docker run --rm jarvis:test python -c "import jarvis; print('✅ Docker build successful')"

  architecture-test:
    name: 🏗️ Multi-Architecture Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build multi-arch
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag jarvis:multi-arch \
            .
