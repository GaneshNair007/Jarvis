[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "1.0.0"
description = "Personal AI Operating System - Local-first, screen-first, voice-driven multi-agent operator."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ganesh Nair" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "websockets>=12.0",
    "cryptography>=50.0.2",
    "numpy>=1.26.0"
]

[project.scripts]
jarvis = "jarvis.main:cli_entrypoint"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
